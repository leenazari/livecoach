<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to LiveCoach</title>
  </head>
  <body style="margin: 0; background: #0b0b09; color: #f7f0e4; font-family: Arial, sans-serif;">
    <div style="max-width: 560px; margin: 0 auto; padding: 40px 24px;">
      <p style="margin: 0 0 10px; color: #e8a94f; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;">
        LiveCoach CRM
      </p>
      <h1 style="margin: 0 0 18px; font-size: 28px; line-height: 1.25;">
        Your secure sign in
      </h1>
      <p style="margin: 0 0 24px; color: #c8c3ba; font-size: 16px; line-height: 1.6;">
        Use the button below to sign in. This link works once and expires shortly.
      </p>
      <p style="margin: 0 0 28px;">
        <a
          href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/crm&amp;method=email"
          style="display: inline-block; border-radius: 999px; background: #e8a94f; color: #11110f; padding: 14px 24px; font-size: 15px; font-weight: 700; text-decoration: none;"
        >Open LiveCoach</a>
      </p>
      <div style="border-top: 1px solid #383631; padding-top: 24px;">
        <p style="margin: 0 0 12px; color: #c8c3ba; font-size: 15px; line-height: 1.5;">
          If the button does not work, enter this six digit code on the LiveCoach login screen.
        </p>
        <p style="margin: 0; color: #f7f0e4; font-size: 30px; font-weight: 700; letter-spacing: 7px;">
          {{ .Token }}
        </p>
      </div>
      <p style="margin: 28px 0 0; color: #7f7b74; font-size: 12px; line-height: 1.5;">
        If you did not request this email, you can ignore it.
      </p>
    </div>
  </body>
</html>
